[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "visor-financiero"
version = "2.4.0"
description = "Bot de Telegram para mercados financieros, feeds de Bluesky y podcasts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Inversiones0101" }]
keywords = ["telegram", "bluesky", "finanzas", "bot", "yfinance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests",
    "feedparser",
    "yfinance",
    "pytz",
    "deep-translator==1.11.4",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
visor-financiero = "visor_financiero.bot:main"

[tool.setuptools]
packages = ["visor_financiero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
